<svg xmlns="http://www.w3.org/2000/svg" width="840" height="737" viewBox="0 0 840 737" role="img" aria-label="Software Engineering (AI) Intern at Sysco Labs, SAGE Engineering Team, June 2025 to June 2026. AI-Driven DORA Metrics Executive Dashboard: Led the end-to-end build of an engineering analytics platform: ETL pipelines and a Base API layer unify GitHub, Jira, Jenkins and Paastry data in MongoDB, surfaced in a React dashboard with Prophet forecasting for engineering leadership. Alfred · Multi-Agent AI Agile Coach: Engineered an assistant orchestrating 15+ specialized agents across RAG, databases, Jira and product-vision workflows, with intelligent prompt routing, LLM evaluation and guardrails for personalized Agile coaching. SAGE · Sysco Agentic Eco-System: Key engineering contributor to an enterprise ecosystem of 100+ applications and 1,000+ agents. Built the end-to-end use-case approval workflow for secure AI deployments and enhanced the Common Chat Client. Contractor Talent Acquisition Portal: Architected the backend services behind end-to-end contractor hiring workflows. Project Summit · Engineering Acceleration Program: Architected Sysco Shop, a microservices e-commerce platform with full system design and API specifications, and designed an ML solution for forecasting delivery metrics."><title>Software Engineering (AI) Intern at Sysco Labs, SAGE Engineering Team, June 2025 to June 2026. AI-Driven DORA Metrics Executive Dashboard: Led the end-to-end build of an engineering analytics platform: ETL pipelines and a Base API layer unify GitHub, Jira, Jenkins and Paastry data in MongoDB, surfaced in a React dashboard with Prophet forecasting for engineering leadership. Alfred · Multi-Agent AI Agile Coach: Engineered an assistant orchestrating 15+ specialized agents across RAG, databases, Jira and product-vision workflows, with intelligent prompt routing, LLM evaluation and guardrails for personalized Agile coaching. SAGE · Sysco Agentic Eco-System: Key engineeri